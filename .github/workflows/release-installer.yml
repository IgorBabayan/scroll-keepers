name: Release - installers

# Runs once for every change that lands on the `release` branch (a merged pull request or a direct push):
# builds the Windows installer, the Linux packages (x64, arm64) and the macOS app (Apple Silicon, Intel), then publishes
#   - all of them as a GitHub Release marked "Latest" (shown in the repo's "Releases" panel; the app's auto-update
#     reads it and picks the file for its platform),
#   - the Windows installer as the "ScrollKeeper" package in GitHub Packages (shown in the repo's "Packages" panel).
# Opening or updating a pull request into `release` does not start a build, so a merge produces exactly one run.
on:
  push:
    branches: [release]
  workflow_dispatch: # manual build + publish from the Actions tab

permissions:
  contents: write # create tags and releases
  packages: write # push to GitHub Packages

concurrency:
  # Publishing is never cancelled; runs for `release` queue one after another.
  group: release-installer-${{ github.ref }}
  cancel-in-progress: false

env:
  PROJECT: ScrollKeeper/ScrollKeeper/ScrollKeeper.csproj
  RUNTIME: win-x64
  CONFIGURATION: Release

jobs:
  # ===== Linux: self-contained build packed as ScrollKeeper-<version>-linux-<arch>.tar.gz =====
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: [linux-x64, linux-arm64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Compute version
        id: version
        shell: bash
        run: |
          base=$(sed -n 's:.*<VersionPrefix>\(.*\)</VersionPrefix>.*:\1:p' "$PROJECT" | head -n 1)
          base=${base:-0.1}
          IFS=. read -r major minor _ <<< "$base"
          version="$major.$minor.$GITHUB_RUN_NUMBER"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

      - name: Publish (self-contained)
        run: >
          dotnet publish ${{ env.PROJECT }}
          -c ${{ env.CONFIGURATION }}
          -r ${{ matrix.rid }}
          --self-contained true
          -p:Version=${{ steps.version.outputs.version }}
          -p:DebugType=none
          -o publish/${{ matrix.rid }}

      - name: Package
        run: bash installer/linux/package.sh publish/${{ matrix.rid }} ${{ steps.version.outputs.version }} ${{ matrix.rid }} dist

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScrollKeeper-${{ steps.version.outputs.version }}-${{ matrix.rid }}
          path: dist/*.tar.gz
          if-no-files-found: error

  # ===== macOS: "Scroll Keeper.app" (ad-hoc signed) zipped as ScrollKeeper-<version>-osx-<arch>.zip =====
  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        rid: [osx-arm64, osx-x64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Compute version
        id: version
        shell: bash
        run: |
          base=$(sed -n 's:.*<VersionPrefix>\(.*\)</VersionPrefix>.*:\1:p' "$PROJECT" | head -n 1)
          base=${base:-0.1}
          IFS=. read -r major minor _ <<< "$base"
          version="$major.$minor.$GITHUB_RUN_NUMBER"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

      - name: Publish (self-contained)
        run: >
          dotnet publish ${{ env.PROJECT }}
          -c ${{ env.CONFIGURATION }}
          -r ${{ matrix.rid }}
          --self-contained true
          -p:Version=${{ steps.version.outputs.version }}
          -p:DebugType=none
          -o publish/${{ matrix.rid }}

      - name: Build the app bundle
        run: bash installer/macos/package-app.sh publish/${{ matrix.rid }} ${{ steps.version.outputs.version }} ${{ matrix.rid }} dist

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScrollKeeper-${{ steps.version.outputs.version }}-${{ matrix.rid }}
          path: dist/*.zip
          if-no-files-found: error

  # ===== Windows: Inno Setup installer, then the GitHub Release with every platform's file =====
  build-installer:
    runs-on: windows-latest
    needs: [build-linux, build-macos]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Compute version
        id: version
        shell: pwsh
        run: |
          [xml]$proj = Get-Content $env:PROJECT
          $base = ($proj.Project.PropertyGroup | ForEach-Object { $_.VersionPrefix } | Where-Object { $_ } | Select-Object -First 1)
          if (-not $base) { $base = '0.1' }
          $parts = $base.Split('.')
          $version = "$($parts[0]).$($parts[1]).$env:GITHUB_RUN_NUMBER"
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version"    >> $env:GITHUB_OUTPUT
          Write-Host "Version: $version"

      - name: Restore
        run: dotnet restore ${{ env.PROJECT }} -r ${{ env.RUNTIME }}

      - name: Publish (self-contained)
        run: >
          dotnet publish ${{ env.PROJECT }}
          -c ${{ env.CONFIGURATION }}
          -r ${{ env.RUNTIME }}
          --self-contained true
          --no-restore
          -p:Version=${{ steps.version.outputs.version }}
          -p:DebugType=none
          -o publish

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build installer
        id: installer
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc `
            "/DAppVersion=${{ steps.version.outputs.version }}" `
            "/DSourceDir=$env:GITHUB_WORKSPACE\publish" `
            "/DOutputDir=$env:GITHUB_WORKSPACE\dist" `
            installer\ScrollKeeper.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = Get-ChildItem dist -Filter 'ScrollKeeper-Setup-*.exe' | Select-Object -First 1
          if (-not $exe) { Write-Error 'The installer was not created.'; exit 1 }
          "path=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          Get-ChildItem dist

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScrollKeeper-Setup-${{ steps.version.outputs.version }}
          path: dist/*.exe
          if-no-files-found: error

      - name: Download Linux and macOS packages
        uses: actions/download-artifact@v4
        with:
          pattern: ScrollKeeper-${{ steps.version.outputs.version }}-*
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ScrollKeeper ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          body: |
            Built from ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}

            - **Windows**: `ScrollKeeper-Setup-${{ steps.version.outputs.version }}.exe` (installs and updates itself).
            - **Linux**: `ScrollKeeper-${{ steps.version.outputs.version }}-linux-x64.tar.gz` (or `-linux-arm64`): extract it and run `./install.sh`, or start `ScrollKeeper` directly.
            - **macOS**: `ScrollKeeper-${{ steps.version.outputs.version }}-osx-arm64.zip` (Apple Silicon) or `-osx-x64.zip` (Intel): unzip and move *Scroll Keeper* to Applications. The app is not notarized: on the first start, right-click it and choose *Open* (or run `xattr -dr com.apple.quarantine "/Applications/Scroll Keeper.app"`).
          generate_release_notes: true
          make_latest: true
          files: |
            dist/*.exe
            dist/*.tar.gz
            dist/*.zip
          fail_on_unmatched_files: true

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: Pack for GitHub Packages
        shell: pwsh
        run: |
          # nuget.exe does not pack the extensionless LICENSE file reliably (NU5030),
          # so a copy named LICENSE.txt is passed to the nuspec by absolute path, like the installer.
          $license = Join-Path $env:RUNNER_TEMP 'LICENSE.txt'
          Copy-Item LICENSE $license -Force
          nuget pack installer\ScrollKeeper.nuspec `
            -Version "${{ steps.version.outputs.version }}" `
            -Properties "version=${{ steps.version.outputs.version }};installer=${{ steps.installer.outputs.path }};license=$license;repoUrl=${{ github.server_url }}/${{ github.repository }}" `
            -OutputDirectory dist `
            -NoPackageAnalysis
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Push to GitHub Packages
        shell: pwsh
        run: |
          dotnet nuget push "dist\ScrollKeeper.${{ steps.version.outputs.version }}.nupkg" `
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" `
            --api-key "${{ secrets.GITHUB_TOKEN }}" `
            --skip-duplicate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
