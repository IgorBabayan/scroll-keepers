name: Release - Windows installer

# Every pull request into the `release` branch builds the Windows installer
# (download it from the run's "Artifacts" to test it before merging).
# When the pull request is MERGED, the installer is also published:
#   - as a GitHub Release marked "Latest" (shown in the repo's "Releases" panel; the app's auto-update reads it),
#   - as the "ScrollKeeper" package in GitHub Packages (shown in the repo's "Packages" panel).
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [release]
  workflow_dispatch: # manual build + publish from the Actions tab

permissions:
  contents: write # create tags and releases
  packages: write # push to GitHub Packages

concurrency:
  # New pushes to an open pull request cancel its previous build; publishing is never cancelled.
  group: release-installer-${{ github.event.pull_request.number || github.ref }}-${{ github.event.action == 'closed' }}
  cancel-in-progress: ${{ github.event.action != 'closed' }}

env:
  PROJECT: ScrollKeeper/ScrollKeeper/ScrollKeeper.csproj
  RUNTIME: win-x64
  CONFIGURATION: Release
  # Publish only for merged pull requests and manual runs.
  PUBLISH: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true }}

jobs:
  build-installer:
    # Skip pull requests that were closed without merging.
    if: github.event_name == 'workflow_dispatch' || github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Merged: the merge commit on `release`. Open pull request: the default test merge of the PR.
          ref: ${{ github.event.pull_request.merged == true && github.event.pull_request.merge_commit_sha || '' }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Compute version
        id: version
        shell: pwsh
        run: |
          [xml]$proj = Get-Content $env:PROJECT
          $base = ($proj.Project.PropertyGroup | ForEach-Object { $_.VersionPrefix } | Where-Object { $_ } | Select-Object -First 1)
          if (-not $base) { $base = '0.1' }
          $parts = $base.Split('.')
          $version = "$($parts[0]).$($parts[1]).$env:GITHUB_RUN_NUMBER"
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version"    >> $env:GITHUB_OUTPUT
          Write-Host "Version: $version (publish: $env:PUBLISH)"

      - name: Restore
        run: dotnet restore ${{ env.PROJECT }} -r ${{ env.RUNTIME }}

      - name: Publish (self-contained)
        run: >
          dotnet publish ${{ env.PROJECT }}
          -c ${{ env.CONFIGURATION }}
          -r ${{ env.RUNTIME }}
          --self-contained true
          --no-restore
          -p:Version=${{ steps.version.outputs.version }}
          -p:DebugType=none
          -o publish

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build installer
        id: installer
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc `
            "/DAppVersion=${{ steps.version.outputs.version }}" `
            "/DSourceDir=$env:GITHUB_WORKSPACE\publish" `
            "/DOutputDir=$env:GITHUB_WORKSPACE\dist" `
            installer\ScrollKeeper.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = Get-ChildItem dist -Filter 'ScrollKeeper-Setup-*.exe' | Select-Object -First 1
          if (-not $exe) { Write-Error 'The installer was not created.'; exit 1 }
          "path=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          Get-ChildItem dist

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScrollKeeper-Setup-${{ steps.version.outputs.version }}
          path: dist/*.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: env.PUBLISH == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ScrollKeeper ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          body: |
            Windows installer built from ${{ github.event.pull_request.html_url || github.sha }}
            ${{ github.event.pull_request.title }}
          generate_release_notes: true
          make_latest: true
          files: dist/*.exe
          fail_on_unmatched_files: true

      - name: Setup NuGet
        if: env.PUBLISH == 'true'
        uses: nuget/setup-nuget@v2

      - name: Pack for GitHub Packages
        if: env.PUBLISH == 'true'
        shell: pwsh
        run: |
          nuget pack installer\ScrollKeeper.nuspec `
            -Version "${{ steps.version.outputs.version }}" `
            -Properties "version=${{ steps.version.outputs.version }};installer=${{ steps.installer.outputs.path }};repoUrl=${{ github.server_url }}/${{ github.repository }}" `
            -OutputDirectory dist `
            -NoPackageAnalysis
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Push to GitHub Packages
        if: env.PUBLISH == 'true'
        shell: pwsh
        run: |
          dotnet nuget push "dist\ScrollKeeper.${{ steps.version.outputs.version }}.nupkg" `
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" `
            --api-key "${{ secrets.GITHUB_TOKEN }}" `
            --skip-duplicate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
