name: Build

# Manual compile check only (Actions tab -> Build -> Run workflow), on Windows, Linux and macOS.
# Pushes to `development` no longer trigger a build; the installers are built when `release` changes
# (see release-installer.yml).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build ScrollKeeper/ScrollKeeper.sln -c Release
